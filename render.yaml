# =============================================================================
# MediStock Platform — Render Blueprint (render.yaml)
# Full-Stack Deployment: Spring Boot Backend & React Vite Static Frontend
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. MediStock Backend Web Service (Java 21 Spring Boot + Neon PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: medistock-backend
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/medistock-backend-1.0.0-SNAPSHOT.jar
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://medistock-frontend.onrender.com,https://*.onrender.com,http://localhost:5173

  # ---------------------------------------------------------------------------
  # 2. MediStock Frontend Static Site (React + Vite + Tailwind CSS)
  # ---------------------------------------------------------------------------
  - type: web
    name: medistock-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://medistock-backend.onrender.com/api
