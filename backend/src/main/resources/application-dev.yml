spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medistock_db
    username: medistock_user
    password: medistock_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.medistock: DEBUG
    org.springframework.security: INFO
