spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/medistock_db}
    username: ${SPRING_DATASOURCE_USERNAME:medistock_user}
    password: ${SPRING_DATASOURCE_PASSWORD:medistock_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.medistock: INFO
    org.springframework.security: WARN
